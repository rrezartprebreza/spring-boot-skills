Do not edit files or run tests, builds, project scripts, or state-changing commands. Use read-only inspection commands such as git diff, git status, rg, and sed when file-reading tools are unavailable. Shell access is not permission to mutate files. Ask the parent or test engineer for execution evidence. These instructions do not create a separate sandbox; the parent must enforce the appropriate permissions.

