name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Validate skill structure and documentation
        run: bash scripts/validate-skills.sh

      - name: Test repository validator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate agent evaluation cases
        run: python3 scripts/evaluate-skills.py --check

      - name: Compile Spring Boot 4 MCP example
        run: mvn --batch-mode --no-transfer-progress -f verification/spring-boot-4-mcp/pom.xml package

      - name: Validate Claude marketplace manifest
        run: python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

      - name: Validate Codex marketplace manifest
        run: python3 -m json.tool .agents/plugins/marketplace.json > /dev/null

      - name: Check whitespace errors
        run: git diff --check

  behavior:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: [boot3, boot4]
        java: ["17", "21"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skills
          POSTGRES_PASSWORD: skills
          POSTGRES_DB: skills
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skills"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test shipped templates against PostgreSQL
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/skills
        run: mvn --batch-mode --no-transfer-progress -f verification/behavior/pom.xml -P${{ matrix.boot }} -Dmaven.compiler.release=${{ matrix.java }} test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-${{ matrix.boot }}-java-${{ matrix.java }}
          path: verification/behavior/target/surefire-reports/
