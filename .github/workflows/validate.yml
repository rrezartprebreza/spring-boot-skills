name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate skill structure and documentation
        run: bash scripts/validate-skills.sh

      - name: Validate Claude marketplace manifest
        run: python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

      - name: Validate Codex marketplace manifest
        run: python3 -m json.tool .agents/plugins/marketplace.json > /dev/null

      - name: Check whitespace errors
        run: git diff --check
